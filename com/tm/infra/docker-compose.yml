# Môi trường local: MongoDB (replica set 1 node, cần cho transaction) + Kafka (KRaft)
# + event-gateway (Go) + friend-service (TypeScript)
#   friend-service ──► Kafka friend_service_events ──► event-gateway ──► Kafka friend_events ──► StarRocks
#                                                           └─ sai contract ──► Kafka friend_events_dlq
#
# + StarRocks (allin1) đọc friend_events bằng Routine Load
#
#   bazel run --config=linux-arm64 //com/tm/event-gateway:event_gateway_docker         # build + load image
#   bazel run --config=linux-arm64 //com/tm/friend-service/src:friend_service_docker   # build + load image
#   cd com/tm/infra && docker compose up -d
#   API:   http://localhost:3000/v1
#   Kafka: localhost:29092 (từ máy host), kafka:9092 (trong network compose)
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      # Tự khởi tạo replica set lần đầu
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Tạo sẵn topic (3 partition) trước khi service / StarRocks dùng
  kafka-init:
    image: apache/kafka:3.8.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in friend_service_events friend_events friend_events_dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic $$t --partitions 3 --replication-factor 1
        done
    depends_on:
      kafka: { condition: service_healthy }
    restart: "no"

  # StarRocks FE + BE trong 1 container. MySQL client: mysql -h 127.0.0.1 -P 9030 -uroot
  starrocks:
    image: starrocks/allin1-ubuntu:3.5.8
    ports:
      - "9030:9030" # MySQL protocol (FE)
      - "8030:8030" # FE web UI
      - "8040:8040" # BE web
    volumes:
      - starrocks-data:/data/deploy/starrocks
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 9030 -uroot --connect-timeout=5 -e \"SHOW BACKENDS\\G\" | grep -q 'Alive: true'"]
      interval: 10s
      retries: 60

  # Tạo bảng ODS / DWD / DWS + Routine Load đọc friend_events (chạy lại nhiều lần được)
  starrocks-init:
    image: starrocks/allin1-ubuntu:3.5.8
    entrypoint: ["/bin/sh", "/init/init.sh"]
    volumes:
      - ./starrocks:/init:ro
    depends_on:
      starrocks: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: "no"

  event-gateway:
    # Image do Bazel build (//com/tm/event-gateway:event_gateway_docker)
    image: com.tm.go.event_gateway:v1.0.0
    ports: ["8080:8080"] # chỉ /healthz
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: event-gateway
      KAFKA_INPUT_TOPIC: friend_service_events
      KAFKA_FRIEND_TOPIC: friend_events
      KAFKA_DLQ_TOPIC: friend_events_dlq
    depends_on:
      kafka-init: { condition: service_completed_successfully }

  friend-service:
    # Image do Bazel build (//com/tm/friend-service/src:friend_service_docker)
    image: com.tm.js.friend_service:v1.0.0
    ports: ["3000:3000"]
    environment:
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
      MONGO_DB: friend_network
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: friend_service_events
      WORKER_ID: "0"
    depends_on:
      mongo: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  # Sinh hành động giả gọi friend-service (mặc định 10 request/s). Không tự chạy:
  #   bazel run --config=linux-arm64 //com/tm/friend-simulator:friend_simulator_docker
  #   docker compose --profile simulator up -d friend-simulator
  friend-simulator:
    image: com.tm.go.friend_simulator:v1.0.0
    profiles: ["simulator"]
    ports: ["8090:8090"] # /healthz, /stats
    environment:
      FRIEND_SERVICE_URL: http://friend-service:3000
      RPS: "10"
      USERS: "1000"
      USER_ID_START: "100000"
    depends_on:
      friend-service: { condition: service_started }

volumes:
  mongo-data:
  starrocks-data:
