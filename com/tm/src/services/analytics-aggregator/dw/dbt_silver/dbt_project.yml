name: 'dbt_starrocks_silver'
version: '1.0.0'
config-version: 2

# Profile chứa connection info (xem profiles.yml)
profile: 'starrocks_silver'

# Paths
model-paths: ["models"]
test-paths: ["tests"]

clean-targets:
  - "target"
  - "dbt_packages"

# =============================================================================
# MODEL CONFIGURATIONS
# =============================================================================
# Silver layer config (StarRocks PRIMARY KEY table):
#   - Materialized as incremental → dbt-starrocks INSERT INTO = UPSERT
#   - unique_key = ['event_id', 'payment_date'] → match PRIMARY KEY table
#   - on_schema_change: ignore (schema cố định, tránh ALTER TABLE)
# =============================================================================
models:
  dbt_starrocks_silver:
    silver:
      +materialized: incremental
