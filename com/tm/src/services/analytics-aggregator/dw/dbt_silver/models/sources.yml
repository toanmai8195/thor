version: 2

sources:
  - name: bronze
    description: Bronze layer - Apache Iceberg trên MinIO (Flink ghi, StarRocks đọc qua external catalog)
    database: iceberg_catalog   # SR external catalog name
    schema: bronze              # Iceberg namespace
    tables:
      - name: payments
        description: Raw payment events từ Flink (Parquet, commit mỗi 60s)
        columns:
          - name: event_id
            tests: [not_null]
          - name: user_id
            tests: [not_null]
          - name: payment_date
            tests: [not_null]
          - name: amount
            tests: [not_null]
