starrocks_silver:
  target: dev
  outputs:
    # ==========================================================================
    # DEV: Local Docker environment
    # ==========================================================================
    dev:
      type: starrocks
      host: "{{ env_var('STARROCKS_HOST', 'starrocks') }}"
      port: 9030                # MySQL protocol port
      database: tracking        # Silver layer nằm trong DB tracking
      schema: tracking
      username: root
      password: ""
      threads: 4
      connect_timeout: 10

    # ==========================================================================
    # PROD: Production StarRocks
    # ==========================================================================
    prod:
      type: starrocks
      host: "{{ env_var('STARROCKS_HOST') }}"
      port: "{{ env_var('STARROCKS_MYSQL_PORT', '9030') | int }}"
      database: tracking
      schema: tracking
      username: "{{ env_var('STARROCKS_USER', 'root') }}"
      password: "{{ env_var('STARROCKS_PASSWORD', '') }}"
      threads: 8
      connect_timeout: 10
