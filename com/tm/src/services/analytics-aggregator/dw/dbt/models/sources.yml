version: 2

sources:
  - name: silver
    description: Silver layer - tracking.silver_payments (StarRocks native, populated by dbt_starrocks_silver)
    database: default_catalog
    schema: tracking
    tables:
      - name: silver_payments
        description: Cleaned payment events từ Iceberg Bronze (normalized status/amount)
        columns:
          - name: event_id
            tests: [not_null]
          - name: payment_date
            tests: [not_null]
          - name: amount
            tests: [not_null]
          - name: status
            tests:
              - accepted_values:
                  values: [paid, pending, failed, refunded, cancelled, unknown]
