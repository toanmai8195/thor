cdp_gold:
  target: dev
  outputs:
    dev:
      type: starrocks
      host: "{{ env_var('STARROCKS_HOST', 'starrocks') }}"
      port: 9030
      database: cdp          # Gold layer cùng DB cdp với Silver
      schema: cdp
      username: root
      password: ""
      threads: 4
      connect_timeout: 10

    prod:
      type: starrocks
      host: "{{ env_var('STARROCKS_HOST') }}"
      port: "{{ env_var('STARROCKS_MYSQL_PORT', '9030') | int }}"
      database: cdp
      schema: cdp
      username: "{{ env_var('STARROCKS_USER', 'root') }}"
      password: "{{ env_var('STARROCKS_PASSWORD', '') }}"
      threads: 8
      connect_timeout: 10
