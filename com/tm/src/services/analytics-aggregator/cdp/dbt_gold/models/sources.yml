version: 2

sources:
  - name: silver
    description: CDP Silver layer — StarRocks cdp database
    database: default_catalog
    schema: cdp
    tables:
      - name: silver_login
        description: Normalized login events
        columns:
          - name: event_id
            tests: [not_null]
          - name: platform
            tests:
              - accepted_values:
                  values: [ios, android, web, unknown]

      - name: silver_view
        description: Normalized page view events
        columns:
          - name: event_id
            tests: [not_null]
          - name: page_url
            tests: [not_null]

      - name: silver_search
        description: Normalized search query events
        columns:
          - name: event_id
            tests: [not_null]
          - name: query
            tests: [not_null]
