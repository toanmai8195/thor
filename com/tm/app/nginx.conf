# SPA + reverse proxy tới backend (giống môi trường prod: 1 origin, không CORS).
#   /api/phonebook/*  → phonebook-service:3100
#   /api/friend/*     → friend-service:3000

server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Resolve tên service lúc có request (DNS của Docker), nên app vẫn lên được khi 1 backend chưa chạy
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $phonebook http://phonebook-service:3100;
    set $friend    http://friend-service:3000;

    # File build có hash trong tên → cache lâu
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: mọi route (/contacts, /sync, …) trả index.html; index.html không cache để luôn lấy bản mới
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/phonebook/ {
        rewrite ^/api/phonebook/(.*)$ /$1 break;
        proxy_pass $phonebook;
        client_max_body_size 5m;          # upload bucket (đã gzip) — server giới hạn 4 MB sau giải nén
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /api/friend/ {
        rewrite ^/api/friend/(.*)$ /$1 break;
        proxy_pass $friend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
