# =============================================================================
# DOCKER COMPOSE — CDP PIPELINE (Dual-Pipeline: Realtime + DW)
# =============================================================================
#
#   login-event-producer (~500 events/s)
#           │ Kafka: login-events
#           ▼
#   cdp-ingestor (validate JSON + event_id)
#           │ Kafka: login-events-ingest
#     ┌─────┴──────────────────────┐
#     │                            │
#     ▼                            ▼
# LUỒNG 1: REALTIME          LUỒNG 2: DW
#   (ClickHouse)          (Iceberg + StarRocks)
#     │                            │
# CH Kafka Engine         Flink (checkpoint 60s)
#     │                            │
# cdp.login_bronze        Iceberg: bronze/login_events
#     │ dbt (1min)              (MinIO, Parquet)
# cdp.silver_login                 │
#     │                    SR Iceberg ext catalog
#  Superset                        │ dbt (3min)
# (realtime)           cdp.silver_login (SR native)
#                                  │ dbt (3min)
#                         cdp.gold_user_daily
#
# =============================================================================
# PORTS:
#   kafka-ui    : 9082
#   clickhouse  : 8124 (HTTP)
#   minio S3    : 9010
#   minio UI    : 9011
#   starrocks   : 9031
#   flink       : 8085
#   airflow     : 8086
#   superset    : 8089
# =============================================================================

version: '3.8'

networks:
  cdp-network:
    driver: bridge
    name: cdp-network

volumes:
  cdp-kafka-data:
  cdp-clickhouse-data:
  cdp-clickhouse-logs:
  cdp-minio-data:
  cdp-starrocks-fe-meta:
  cdp-starrocks-be-storage:
  cdp-airflow-logs:
  cdp-airflow-db-data:
  cdp-superset-home:

services:
  # ===========================================================================
  # KAFKA
  # ===========================================================================
  kafka:
    image: apache/kafka:4.2.0
    container_name: cdp-kafka
    hostname: kafka
    networks:
      - cdp-network
    # Không expose host port — Kafka chỉ cần nội bộ trong cdp-network
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: cdpClusterIdXYZ1234567
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - cdp-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cdp-kafka-ui
    networks:
      - cdp-network
    ports:
      - "9082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cdp-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka

  # ===========================================================================
  # CLICKHOUSE — Realtime Bronze + Silver (Luồng 1)
  # HTTP: http://localhost:8124  |  Native: clickhouse:9000 (internal only)
  # Init scripts: ./clickhouse/init/ (chạy tự động lần đầu)
  # ===========================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:26.2
    container_name: cdp-clickhouse
    hostname: clickhouse
    networks:
      - cdp-network
    ports:
      - "8124:8123"   # HTTP (dbt, Superset, curl)
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - cdp-clickhouse-data:/var/lib/clickhouse
      - cdp-clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/custom.xml:ro
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  # EVENT PRODUCER & CDP INGESTOR
  # Build: bazel run //com/tm/src/services/<name>:<name>_docker
  # ===========================================================================
  login-event-producer:
    image: com.tm.go.login-event-producer:v1.0.0
    container_name: cdp-login-event-producer
    hostname: login-event-producer
    networks:
      - cdp-network
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "-kafka=kafka:9092"
      - "-topic=login-events"
      - "-rate=500"
    restart: unless-stopped

  cdp-ingestor:
    image: com.tm.go.cdp-ingestor:v1.0.0
    container_name: cdp-ingestor
    hostname: cdp-ingestor
    networks:
      - cdp-network
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - "-kafka=kafka:9092"
      - "-input-topic=login-events"
      - "-output-topic=login-events-ingest"
      - "-group=cdp-login-ingestor"
    restart: unless-stopped

  # ===========================================================================
  # MINIO — S3-compatible object store
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: cdp-minio
    hostname: minio
    networks:
      - cdp-network
    ports:
      - "9010:9000"   # S3 API
      - "9011:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - cdp-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ===========================================================================
  # STARROCKS — CDP query engine
  # MySQL: mysql -h 127.0.0.1 -P 9031 -u root
  # ===========================================================================
  starrocks:
    image: starrocks/allin1-ubuntu:3.2.7
    container_name: cdp-starrocks
    hostname: starrocks
    networks:
      - cdp-network
    ports:
      - "9031:9030"   # MySQL protocol
      - "8031:8030"   # FE HTTP
      - "8041:8040"   # BE HTTP
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - cdp-starrocks-fe-meta:/opt/starrocks/fe/meta
      - cdp-starrocks-be-storage:/opt/starrocks/be/storage
      - ./hadoop/core-site.xml:/data/deploy/starrocks/fe/conf/core-site.xml:ro
      - ./hadoop/core-site.xml:/data/deploy/starrocks/be/conf/core-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8030/api/health 2>/dev/null | grep -q 'OK'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # ===========================================================================
  # FLINK — Kafka → Iceberg Bronze (login events)
  # Web UI: http://localhost:8085
  # ===========================================================================
  flink-jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    container_name: cdp-flink-jobmanager
    hostname: flink-jobmanager
    networks:
      - cdp-network
    ports:
      - "8085:8081"   # Flink Web UI
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1600m
        s3.endpoint: http://minio:9000
        s3.path-style-access: true
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview 2>/dev/null | grep -q 'taskmanagers'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  flink-taskmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    container_name: cdp-flink-taskmanager
    hostname: flink-taskmanager
    networks:
      - cdp-network
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 1728m
        s3.endpoint: http://minio:9000
        s3.path-style-access: true
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    restart: unless-stopped

  flink-login-job:
    build:
      context: .
      dockerfile: Dockerfile.flink
    container_name: cdp-flink-login-job
    networks:
      - cdp-network
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./flink:/opt/flink/jobs:ro
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        s3.endpoint: http://minio:9000
        s3.path-style-access: true
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command:
      - sh
      - -c
      - "/opt/flink/bin/sql-client.sh -f /opt/flink/jobs/kafka_login_to_iceberg.sql"
    restart: on-failure

  # ===========================================================================
  # DBT-SILVER — one-shot transform Iceberg Bronze → StarRocks Silver
  # ===========================================================================
  dbt-silver:
    build:
      context: ../../src/services/analytics-aggregator/cdp
      dockerfile: Dockerfile.dbt
    container_name: cdp-dbt-silver
    networks:
      - cdp-network
    volumes:
      - ../../src/services/analytics-aggregator/cdp/dbt_silver:/usr/app
    environment:
      STARROCKS_HOST: starrocks
      STARROCKS_MYSQL_PORT: "9030"
    command: ["run", "--profiles-dir", "."]
    depends_on:
      starrocks:
        condition: service_healthy
    profiles:
      - dbt
    restart: "no"

  # ===========================================================================
  # AIRFLOW — Orchestrator
  # DAGs: src/services/analytics-aggregator/cdp/dags/
  # ===========================================================================
  airflow-postgres:
    image: postgres:15
    container_name: cdp-airflow-postgres
    networks:
      - cdp-network
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - cdp-airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: cdp-airflow-webserver
    hostname: cdp-airflow-webserver
    networks:
      - cdp-network
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@cdp-airflow-postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      STARROCKS_HOST: starrocks
      STARROCKS_MYSQL_PORT: "9030"
    volumes:
      - ../../src/services/analytics-aggregator/cdp/dags:/opt/airflow/dags
      - ../../src/services/analytics-aggregator:/opt/analytics
      - cdp-airflow-logs:/opt/airflow/logs
    ports:
      - "8086:8080"
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: cdp-airflow-scheduler
    hostname: cdp-airflow-scheduler
    networks:
      - cdp-network
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@cdp-airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      STARROCKS_HOST: starrocks
      STARROCKS_MYSQL_PORT: "9030"
    volumes:
      - ../../src/services/analytics-aggregator/cdp/dags:/opt/airflow/dags
      - ../../src/services/analytics-aggregator:/opt/analytics
      - cdp-airflow-logs:/opt/airflow/logs
    command: scheduler
    restart: unless-stopped

  # ===========================================================================
  # SUPERSET — BI Dashboard (StarRocks connection)
  # http://localhost:8089  |  admin / admin
  # StarRocks URI: starrocks+pymysql://root:@starrocks:9030/cdp
  # ===========================================================================
  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: cdp-superset
    hostname: cdp-superset
    networks:
      - cdp-network
    ports:
      - "8089:8088"
    environment:
      SUPERSET_SECRET_KEY: "cdp9d0aaf944ec51fe797903d02eb653ee605b0ef0d9f887c7bb6574ba8b425e"
    volumes:
      - cdp-superset-home:/app/superset_home
    depends_on:
      starrocks:
        condition: service_healthy
    command:
      - sh
      - -c
      - "superset run -h 0.0.0.0 -p 8088 --with-threads"
    restart: unless-stopped
