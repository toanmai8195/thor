# =============================================================================
# CDP Event Registry — Source of truth cho tất cả pipeline automation
# =============================================================================
# Thêm event source mới: thêm 1 entry vào đây, chạy submit_from_registry.sh
# KHÔNG cần sửa Flink SQL, Airflow DAG, hay dbt boilerplate.
#
# Sau khi thêm source mới:
#   1. Tạo dbt silver model: dbt_silver/models/silver/silver_<source_id>.sql
#   2. (Optional) Tạo dbt gold model: dbt_gold/models/gold/gold_<source_id>_daily.sql
#   3. Chạy: ./flink/submit_from_registry.sh <source_id>
# =============================================================================

sources:
  - source_id: login
    description: "User login events — first CDP data source"
    kafka_topic: login-events-ingest
    flink_consumer_group: flink-iceberg-cdp-login
    ch_consumer_group: ch-cdp-login
    iceberg_database: bronze
    iceberg_table: login_events
    sr_silver_model: silver_login
    sr_gold_model: gold_user_daily         # null nếu chưa có gold
    partition_field: event_date
    enabled: true
    fields:
      - {name: event_id,   type: STRING,  comment: "UUID v4"}
      - {name: user_id,    type: BIGINT,  comment: "User ID"}
      - {name: session_id, type: STRING,  comment: "Session UUID"}
      - {name: device_id,  type: STRING,  comment: "Device UUID"}
      - {name: platform,   type: STRING,  comment: "ios|android|web|unknown"}
      - {name: country,    type: STRING,  comment: "Country code (VN/US/SG/...)"}
      - {name: event_date, type: STRING,  comment: "YYYY-MM-DD"}
      - {name: login_at,   type: STRING,  comment: "ISO8601 timestamp"}

  # Thêm source mới ở đây — ví dụ (Step 3):
  # - source_id: view
  #   description: "Page view events"
